name: Detect affected areas
description: >-
  Classify a PR's changed files into CI work lanes (python, frontend, site,
  scan, deps, mcp_catalog) so the orchestrator can conditionally call only
  the sub-workflows a PR can affect. Outputs are always "true" on push/dispatch
  events and fail open (everything "true") when the diff cannot be computed.

inputs:
  github-token:
    description: Token for the GitHub API (gh CLI). Pass steps.app-token.outputs.token from the calling workflow.
    required: false
    default: ${{ github.token }}

outputs:
  python:
    description: Run Python tests / ruff / ty / windows-footguns.
    value: ${{ steps.classify.outputs.python }}
  python_prod:
    description: Python changes outside tests/ — gates product jobs (Desktop E2E, Docker).
    value: ${{ steps.classify.outputs.python_prod }}
  frontend:
    description: Run the TypeScript testing matrix + desktop build.
    value: ${{ steps.classify.outputs.frontend }}
  docker_meta:
    description: Docker setup and meta files have changed.
    value: ${{ steps.classify.outputs.docker_meta }}
  site:
    description: Build the Docusaurus docs site.
    value: ${{ steps.classify.outputs.site }}
  scan:
    description: Run the supply-chain critical-pattern scanner.
    value: ${{ steps.classify.outputs.scan }}
  deps:
    description: Check pyproject.toml dependency upper bounds.
    value: ${{ steps.classify.outputs.deps }}
  npm_lock:
    description: Post/update the semantic package-lock.json diff PR comment.
    value: ${{ steps.classify.outputs.npm_lock }}
  installer:
    description: Run the PowerShell installer tests on a Windows runner.
    value: ${{ steps.classify.outputs.installer }}
  mcp_catalog:
    description: Require MCP catalog security review label.
    value: ${{ steps.classify.outputs.mcp_catalog }}
  ci_review:
    description: Require CI-sensitive file review label.
    value: ${{ steps.classify.outputs.ci_review }}
  ci_review_files:
    description: JSON list of CI-sensitive files changed by the pull request.
    value: ${{ steps.classify.outputs.ci_review_files }}
  root_npm_available:
    description: Root npm manifest and lockfile are available for JS checks.
    value: ${{ steps.classify.outputs.root_npm_available }}
  site_available:
    description: Website manifest and lockfile are available for Docs Site checks.
    value: ${{ steps.classify.outputs.site_available }}
  dockerfile_available:
    description: Dockerfile is available for Docker image workflows.
    value: ${{ steps.classify.outputs.dockerfile_available }}
  hadolint_available:
    description: Dockerfile and Hadolint config are available for Docker lint.
    value: ${{ steps.classify.outputs.hadolint_available }}
  docker_scripts_available:
    description: docker/ scripts are available for ShellCheck.
    value: ${{ steps.classify.outputs.docker_scripts_available }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: classify
      shell: bash
      env:
        # Fall back to the built-in read-only token when the caller passes an
        # empty value. Fork PRs get no repo secrets, so AUTOFIX_BOT_PAT is ""
        # there, and an input `default:` only applies when the input is omitted,
        # not when it's passed empty. Without this fallback the compare API
        # fails on forks and the classifier fails open (every lane forced on).
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        # Only pull_request events are gated. Other events (push, release,
        # dispatch) leave CHANGED empty, so the classifier fails open and every
        # lane runs. Post-merge / on-demand validation is never weakened.
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # Use the compare endpoint with the pinned base/head SHAs from the
          # event payload instead of the "current PR files" endpoint. The SHAs
          # are frozen at trigger time, so the file list is deterministic even
          # if the PR receives a new push between trigger and detect.
          #
          # Retried: a rate-limit blip or eventual-consistency 404 on a
          # freshly-pushed HEAD would otherwise silently fall open (all lanes
          # run — safe, but wasteful and it masks the API failure).
          #
          # `.files[]?` (null-safe): with --paginate, a PR more than 100
          # commits ahead of its merge-base paginates the compare, and pages
          # after the first carry `files: null` — bare `.files[]` makes jq
          # die with "cannot iterate over: null", which fails every retry
          # and forces the fail-open path (seen on stacked PRs). The full
          # file list (up to the API's 300-file cap) is on page one.
          CHANGED=""
          for i in 1 2 3; do
            if CHANGED="$(gh api \
              --paginate \
              "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.files[]?.filename')"; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::warning::compare API failed after 3 attempts — failing open (all lanes run)"
              CHANGED=""
              break
            fi
            echo "::warning::compare API failed (attempt $i); retrying in 10s"
            sleep 10
          done
        fi

        echo "Changed files:"
        printf '%s\n' "${CHANGED:-(none)}"
        printf '%s\n' "${CHANGED:-}" | python3 scripts/ci/classify_changes.py

        # Availability is separate from change classification. For pull
        # requests, compare both trees: if a required input existed on base but
        # was deleted by the PR, keep the lane enabled so the deletion fails
        # visibly instead of hiding the check. API uncertainty fails open.
        root_npm_available=true
        site_available=true
        dockerfile_available=true
        hadolint_available=true
        docker_scripts_available=true

        if [ "$EVENT_NAME" = "pull_request" ]; then
          # Git-tree responses can be truncated. Any API error or truncation is
          # uncertainty, so keep every availability lane enabled (fail open).
          if ! BASE_TREE_JSON="$(gh api "repos/${REPO}/git/trees/${BASE_SHA}?recursive=1")" || \
             ! HEAD_TREE_JSON="$(gh api "repos/${REPO}/git/trees/${HEAD_SHA}?recursive=1")"; then
            echo "::warning::tree availability lookup failed; keeping all availability lanes enabled"
          elif [ "$(jq -r '.truncated // false' <<<"$BASE_TREE_JSON")" = "true" ] || \
               [ "$(jq -r '.truncated // false' <<<"$HEAD_TREE_JSON")" = "true" ]; then
            echo "::warning::tree availability response was truncated; keeping all availability lanes enabled"
          else
            BASE_TREE="$(jq -r '.tree[]?.path' <<<"$BASE_TREE_JSON")"
            HEAD_TREE="$(jq -r '.tree[]?.path' <<<"$HEAD_TREE_JSON")"
            has_path() {
              printf '%s\n' "$1" | grep -Fxq -- "$2"
            }
            has_any_npm_lock() {
              has_path "$1" package-lock.json || has_path "$1" npm-shrinkwrap.json
            }
            # A lane is unavailable only when its complete required input set
            # is absent from both base and head. A deletion therefore remains
            # enabled and fails in the lane rather than being hidden.
            if ! { has_path "$BASE_TREE" package.json && has_any_npm_lock "$BASE_TREE"; } && \
               ! { has_path "$HEAD_TREE" package.json && has_any_npm_lock "$HEAD_TREE"; }; then
              root_npm_available=false
            fi
            if ! { has_path "$BASE_TREE" website/package.json && has_path "$BASE_TREE" website/package-lock.json; } && \
               ! { has_path "$HEAD_TREE" website/package.json && has_path "$HEAD_TREE" website/package-lock.json; }; then
              site_available=false
            fi
            if ! has_path "$BASE_TREE" Dockerfile && ! has_path "$HEAD_TREE" Dockerfile; then
              dockerfile_available=false
            fi
            if ! { has_path "$BASE_TREE" Dockerfile && has_path "$BASE_TREE" .hadolint.yaml; } && \
               ! { has_path "$HEAD_TREE" Dockerfile && has_path "$HEAD_TREE" .hadolint.yaml; }; then
              hadolint_available=false
            fi
            if ! printf '%s\n' "$BASE_TREE" | grep -q '^docker/' && ! printf '%s\n' "$HEAD_TREE" | grep -q '^docker/'; then
              docker_scripts_available=false
            fi
          fi
        fi

        echo "root_npm_available=${root_npm_available}" >> "$GITHUB_OUTPUT"
        echo "site_available=${site_available}" >> "$GITHUB_OUTPUT"
        echo "dockerfile_available=${dockerfile_available}" >> "$GITHUB_OUTPUT"
        echo "hadolint_available=${hadolint_available}" >> "$GITHUB_OUTPUT"
        echo "docker_scripts_available=${docker_scripts_available}" >> "$GITHUB_OUTPUT"
        {
          echo "### CI infrastructure availability"
          echo "- Root npm workspace inputs: \`${root_npm_available}\`"
          echo "- Website inputs: \`${site_available}\`"
          echo "- Dockerfile: \`${dockerfile_available}\`"
          echo "- Hadolint inputs: \`${hadolint_available}\`"
          echo "- Docker scripts: \`${docker_scripts_available}\`"
        } >> "$GITHUB_STEP_SUMMARY"
