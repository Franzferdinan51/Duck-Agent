<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e12" />
    <link rel="icon" type="image/svg+xml" href="/duck-agent-mark.svg" />
    <link rel="apple-touch-icon" href="/duck-agent-mark.svg" />
    <title>Duck Agent</title>
    <script>
      try {
        let bg = localStorage.getItem('duck-agent-boot-background')
        let scheme = localStorage.getItem('duck-agent-boot-color-scheme')
        if (!bg) {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          bg = dark ? '#0b0e12' : '#f7f7f7'
          scheme = dark ? 'dark' : 'light'
        }
        document.documentElement.style.backgroundColor = bg
        if (scheme === 'dark' || scheme === 'light') document.documentElement.style.colorScheme = scheme
      } catch {
        // Storage can be unavailable in hardened renderer contexts.
      }
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
